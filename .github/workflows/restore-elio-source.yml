name: Restore verified latest Elio sources
on:
  push:
    branches: ["update/latest-source-fbf54ce7"]
    paths: [".github/workflows/restore-elio-source.yml"]
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/latest-source-fbf54ce7
      - name: Restore SHA256 verified source bundle
        shell: python
        run: |
          import base64,hashlib,json,lzma,pathlib,shutil
          root=pathlib.Path('.')
          parts=sorted((root/'.elio-source-transfer').glob('source-*.b64'))
          assert len(parts)==14, 'Incomplete source transfer'
          data=base64.b64decode(''.join(p.read_text(encoding='ascii') for p in parts),validate=True)
          assert hashlib.sha256(data).hexdigest()=='5a6843c6f86175357f95567fc2c0876d741ea7f8d4e48d61cc6830fa7b0e830c', 'Bundle SHA256 mismatch'
          bundle=json.loads(lzma.decompress(data))
          for name,h in bundle['manifest'].items():
              path=root/name
              assert not pathlib.PurePosixPath(name).is_absolute() and '..' not in pathlib.PurePosixPath(name).parts
              content=bundle['objects'][h].encode('utf8')
              assert hashlib.sha256(content).hexdigest()==h, name
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(content)
          shutil.rmtree(root/'.elio-source-transfer')
          (root/'.github/workflows/restore-elio-source.yml').unlink()
      - name: Commit latest source and remove temporary uploader
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Update latest Elio sources: 5515-asset library and full audit fixes'
          git push origin HEAD:update/latest-source-fbf54ce7
