name: Build elio icons and background update presentation
on:
  push:
    branches: [icons-updater-1.19.19]
    # Only the workflow commit (which pins the new source checksum) starts a build;
    # uploading the source parts in earlier commits must not trigger partial runs.
    # 1.22.1 build 1: Model Builder Generate, Notion send confirmation, add-on timeouts, Git, Ollama and Roblox timeouts.
    paths: [.github/workflows/appearance-build.yml]
  workflow_dispatch:
concurrency:
  group: elio-appearance-validation
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  memory-and-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Assemble verified build source
        run: |
          cat appearance-source/appearance-source.zip.b64.part* | base64 --decode > appearance-source.zip
          echo '770c9968a03c80164976a0e95244be33d319c8399b61d3265762273682857c7f  appearance-source.zip' | sha256sum --check
      - run: unzip -q appearance-source.zip -d build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: build/elio/agent
      - name: Native tests and debug runtime
        working-directory: build/elio/agent
        run: |
          cargo test --locked
          cargo build --locked
      - name: Fetch pinned official Engram runtime
        run: |
          curl --fail --location --retry 3 https://github.com/Gentleman-Programming/engram/releases/download/v3.0.0/engram_3.0.0_linux_amd64.tar.gz -o /tmp/engram.tar.gz
          echo '22bbfd81ee9071a04d446f653842c383a3101b594e8829519a63a7c747602e69  /tmp/engram.tar.gz' | sha256sum --check
          mkdir -p /tmp/engram-runtime
          tar -xzf /tmp/engram.tar.gz -C /tmp/engram-runtime
      - name: Real MCP and large-template integration checks
        working-directory: build/elio
        env:
          ELIO_TEST_ENGRAM: /tmp/engram-runtime/engram
        run: python test-memory-template-runtime.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: browser-actions/setup-firefox@v1
        id: firefox
      - name: Install verified official geckodriver
        run: |
          curl --fail --location --retry 3 https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz -o /tmp/geckodriver.tar.gz
          echo 'e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e  /tmp/geckodriver.tar.gz' | sha256sum --check
          mkdir -p /tmp/elio-geckodriver
          tar -xzf /tmp/geckodriver.tar.gz -C /tmp/elio-geckodriver
      - run: npm install --prefix /tmp/elio-firefox-tests selenium-webdriver
      - name: Real Firefox extension and native bridge checks
        timeout-minutes: 3
        working-directory: build/elio
        env:
          NODE_PATH: /tmp/elio-firefox-tests/node_modules
          ELIO_TEST_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
          ELIO_TEST_GECKODRIVER: /tmp/elio-geckodriver/geckodriver
          ELIO_TEST_NATIVE: ${{ github.workspace }}/build/elio/agent/target/debug/elio
        run: node firefox-runtime-check.js
      - name: Real Firefox paste and file-transfer checks
        timeout-minutes: 4
        working-directory: build/elio
        env:
          NODE_PATH: /tmp/elio-firefox-tests/node_modules
          ELIO_TEST_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
          ELIO_TEST_GECKODRIVER: /tmp/elio-geckodriver/geckodriver
        run: node firefox-transfer-check.js
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble verified build source
        run: |
          cat appearance-source/appearance-source.zip.b64.part* | base64 --decode > appearance-source.zip
          echo '770c9968a03c80164976a0e95244be33d319c8399b61d3265762273682857c7f  appearance-source.zip' | sha256sum --check
      - run: unzip -q appearance-source.zip -d build
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/elio-tests jsdom@26 playwright
      - run: /tmp/elio-tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Check behavior, spacing and notification layouts
        working-directory: build/elio
        env:
          NODE_PATH: /tmp/elio-tests/node_modules
        run: |
          python ../../test-javascript.py
          node test-design-upgrade.js
          node test-desktop-regression.js
          node test-theme-sync.js
          node test-package-version-display.js
          ELIO_TEST_STUDIO_STATUS=1 node test-page-startup.js
          node ../../appearance-visual.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appearance-visual-checks
          path: build/elio/visual-checks
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Extract verified build source
        shell: bash
        run: python -c "import base64,glob,hashlib,zipfile; data=base64.b64decode(''.join(open(p).read() for p in sorted(glob.glob('appearance-source/appearance-source.zip.b64.part*')))); assert hashlib.sha256(data).hexdigest()=='770c9968a03c80164976a0e95244be33d319c8399b61d3265762273682857c7f', 'Build source checksum mismatch'; open('appearance-source.zip','wb').write(data); zipfile.ZipFile('appearance-source.zip').extractall('build')"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: build/elio/agent
      - name: Fetch verified prior release for macOS bundle resources
        if: runner.os == 'macOS'
        run: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/stoveez/Elio/bb3c7f77b570ccd028bc7875d5fcc1e7b3e499bf/Elio-1.19.32.zip -o Elio-1.19.32.zip
          echo '003dd626ede1424aa035ef0c5efa92410cb5aa8e29f41bd8532f02bf15b4eb21  elio-1.19.32.zip' | shasum -a 256 --check
      - name: Native regression tests
        working-directory: build/elio/agent
        run: cargo test --locked
      - name: Windows installer regression checks
        if: runner.os == 'Windows'
        working-directory: build/elio
        run: |
          ./test-updater.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File test-update-presentation.ps1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && always()
        with:
          name: windows-updater-presentation
          path: build/elio/visual-checks/updater-*
      - name: Windows release build
        if: runner.os == 'Windows'
        working-directory: build/elio/agent
        run: cargo build --release --locked
      - name: Embedded Windows application and tray icon checks
        if: runner.os == 'Windows'
        working-directory: build/elio
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File test-application-icon.ps1
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && always()
        with:
          name: windows-application-icons
          path: build/elio/visual-checks/application-icon-*
      - name: Universal macOS release build
        if: runner.os == 'macOS'
        working-directory: build/elio/agent
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin
          mkdir -p target/release
          lipo -create target/x86_64-apple-darwin/release/elio target/aarch64-apple-darwin/release/elio -output target/release/elio
          lipo -info target/release/elio
          python ../build-macos-bundle.py
      - name: Real Windows desktop updater relaunch
        if: runner.os == 'Windows'
        working-directory: build/elio
        run: |
          $out = (python test-update-relaunch.py 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Output $out
          if ($code -ne 0) {
            $tail = if ($out.Length -gt 3500) { $out.Substring($out.Length - 3500) } else { $out }
            $msg = $tail.Replace('%','%25').Replace("`r",'').Replace("`n",'%0A')
            Write-Output "::error title=Real Windows desktop updater relaunch::$msg"
            exit $code
          }
      - name: Windows bundled Engram integration
        if: runner.os == 'Windows'
        working-directory: build/elio
        env:
          ELIO_TEST_BINARY: agent/target/release/elio.exe
          ELIO_TEST_ENGRAM: ../../engram-runtime/engram.exe
        run: |
          curl.exe --fail --location --retry 3 https://github.com/Gentleman-Programming/engram/releases/download/v3.0.0/engram_3.0.0_windows_amd64.zip -o ../../engram.zip
          if ((Get-FileHash ../../engram.zip -Algorithm SHA256).Hash -ne 'bb410e4a578bee96888f848764dbbf9e7dd78971204c05bb7fb81a4a8db324a3') { throw 'Engram checksum mismatch' }
          Expand-Archive ../../engram.zip ../../engram-runtime
          python test-memory-template-runtime.py
      - name: macOS signed-bundle Engram integration
        if: runner.os == 'macOS'
        working-directory: build/elio
        env:
          ELIO_TEST_BUNDLE: agent/target/release/elio.app
        run: |
          python -c "import os,platform,runpy; arch='arm64' if platform.machine().lower() in ['arm64','aarch64'] else 'amd64'; os.environ['ELIO_TEST_ENGRAM']='agent/target/release/elio.app/Contents/Resources/engram/engram-darwin-'+arch; runpy.run_path('test-memory-template-runtime.py',run_name='__main__')"
      - name: Native runtime smoke test
        working-directory: build/elio
        run: |
          python test-platform-smoke.py
          python test-blender-native.py
          python test-auto-update-launch.py
          python test-auto-update-after-launch.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}
          path: build/elio/agent/target/release/elio*
  package-and-publish:
    needs: [visual, native, memory-and-templates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts
      - name: Fetch validated source and packager from the exact build commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for part in $(gh api "repos/$GITHUB_REPOSITORY/contents/appearance-source?ref=$GITHUB_SHA" --jq '.[].name' | sort); do curl --fail --location --silent --show-error "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/appearance-source/$part"; done | base64 --decode > appearance-source.zip
          echo '770c9968a03c80164976a0e95244be33d319c8399b61d3265762273682857c7f  appearance-source.zip' | sha256sum --check
          gh api "repos/$GITHUB_REPOSITORY/contents/package-appearance.py?ref=$GITHUB_SHA" --jq .content | base64 --decode > package-appearance.py
          gh api "repos/$GITHUB_REPOSITORY/contents/publisher-appearance.py?ref=$GITHUB_SHA" --jq .content | base64 --decode > publisher-appearance.py
          unzip -q appearance-source.zip -d build
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix build/elio/release-tools terser@5.44.0 acorn@8.15.0 jsdom@26
      - name: Create and validate both platform downloads
        env:
          NODE_PATH: ${{ github.workspace }}/build/elio/release-tools/node_modules
        run: |
          python -c "import json; assert json.load(open('latest.json'))['version']=='1.22.0', 'Main release changed; manual rebase required'"
          python package-appearance.py
          python -c "import publish_release,json,pathlib; f=json.load(open('latest.json')); publish_release.validate_archive(pathlib.Path('elio-1.22.1.zip').read_bytes(),'1.22.1','windows'); publish_release.validate_archive(pathlib.Path('elio-macOS-1.22.1.zip').read_bytes(),'1.22.1','macos')"
      - uses: actions/attest@v4
        id: provenance
        with:
          subject-path: |
            elio-1.22.1.zip
            elio-macOS-1.22.1.zip
            elio-source-1.22.1.zip
            elio-Firefox-1.22.1.zip
            latest.json
            latest-macos.json
      - name: Verify build provenance before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" elio-1.22.1.sigstore.json
          for file in elio-1.22.1.zip elio-macOS-1.22.1.zip elio-source-1.22.1.zip elio-Firefox-1.22.1.zip latest.json latest-macos.json; do gh attestation verify "$file" --repo "$GITHUB_REPOSITORY"; done
      - name: Commit release files and publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'elio release automation'
          git config user.email 'actions@users.noreply.github.com'
          git rm elio-1.22.0.zip elio-macOS-1.22.0.zip
          git add elio-Firefox-1.22.1.zip publish_release.py Update-elio.ps1 elio-1.22.1.zip elio-macOS-1.22.1.zip elio-source-1.22.1.zip elio-1.22.1.sigstore.json latest.json latest-macos.json SHA256SUMS.txt release-metadata.json release-notes.json README.md UPDATE.txt MAINTENANCE.md VALIDATION.txt release-description-1.22.1.txt
          git commit -m 'Release elio 1.22.1: Model Builder, Notion and add-on fixes'
          git push origin HEAD:main
          export GITHUB_SHA=$(git rev-parse HEAD)
          python publish_release.py
