name: Apply popup dismissal patch (temporary)
on:
  push:
    branches: [integration/main-merge]
    paths: ['.elio-integration/patch.b64']
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .elio-integration/patch.b64 | xz -d > /tmp/popups.patch
          echo 'edfc64a2dea7a0dd4dec8a5ffc660b5c46b1042d8f43d4e2f7209afc9e0f6c73  /tmp/popups.patch' | sha256sum -c -
          git rm -rq .elio-integration
          git apply --check /tmp/popups.patch
          git apply --index /tmp/popups.patch
          python tools/generate_locale_catalog.py
          python tools/stamp_build.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A core elio-Extension
          git commit -m 'Let floating popups be closed with × for the browser session; keep explicit in-app status' -m 'Update/connection notice, skill offer and continuation offer get a close button. Dismissal is remembered per popup kind in chrome.storage.session; a different or newer popup still appears. In-app indicators (bar version tag, extension popup, desktop) keep showing "Elio not connected" / "No stable release found".'
          git push origin HEAD:integration/main-merge
      - name: Start Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-windows.yml --ref integration/main-merge -f publish=false
