name: Build and release Elio (Windows x64)
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested Windows archive as a GitHub Release
        type: boolean
        default: false
  push:
    branches:
      - update/latest-source-fbf54ce7
    paths-ignore:
      - '.elio-ports-transfer/**'
      - '.github/workflows/apply-useful-ports.yml'
    tags:
      - 'v[0-9]*'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Verify tag and package versions
        shell: pwsh
        run: |
          $Version = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$Version") { throw 'Tag does not match the package version.' }
      - name: Install Chromium for Playwright tests
        shell: pwsh
        run: |
          npm ci --prefix release-tools --include=dev --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Pinned test dependencies could not be installed.' }
          node ./release-tools/node_modules/playwright/cli.js install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Playwright Chromium installation failed.' }
      - name: Audit, test, compile and package
        shell: pwsh
        run: |
          try {
            & ./Build-Windows.ps1 *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/elio-build.log"
            if ($LASTEXITCODE -ne 0) { throw "Build exited with $LASTEXITCODE" }
          } catch {
            if (Test-Path "$env:RUNNER_TEMP/elio-build.log") {
              Get-Content "$env:RUNNER_TEMP/elio-build.log" -Tail 65 | ForEach-Object {
                $Line = ("$_" -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A')
                Write-Output "::error::$Line"
              }
            }
            throw
          }
      - name: Verify real headless Blender lifecycle
        shell: pwsh
        run: |
          # CI only: never bundled, installed on the user PC, or published with Elio.
          $Zip = Join-Path $env:RUNNER_TEMP 'blender-4.5.3-windows-x64.zip'
          curl.exe --fail --location --retry 3 'https://mirror.clarkson.edu/blender/release/Blender4.5/blender-4.5.3-windows-x64.zip' --output $Zip
          if ($LASTEXITCODE -ne 0) { throw 'Blender CI fixture download failed.' }
          if ((Get-FileHash $Zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '6b657c8bdd3a7b65b07b9e1ae17eb4be7dd4aa23121da7f3d3354fc2551330a7') { throw 'Blender CI fixture checksum mismatch.' }
          Expand-Archive -Path $Zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'elio-blender-fixture')
          $env:ELIO_TEST_BLENDER = Join-Path $env:RUNNER_TEMP 'elio-blender-fixture/blender-4.5.3-windows-x64/blender.exe'
          $env:ELIO_TEST_NATIVE = Join-Path $PWD 'agent/target/release/elio.exe'
          python -u tools/test_blender_headless.py
          if ($LASTEXITCODE -ne 0) { throw 'Real Windows Blender lifecycle regression failed.' }
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elio-Windows-x64
          path: dist/elio-v*-Windows-x64.zip
          if-no-files-found: error
      - name: Publish complete stable GitHub Release
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $Zip = @(Get-ChildItem dist/elio-v*-Windows-x64.zip)
          if ($Zip.Count -ne 1) { throw 'Expected exactly one Windows ZIP.' }
          $Version = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          if ($Version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a three-part stable package version.' }
          $Tag = "v$Version"
          $Title = "Elio $Tag"
          # A new immutable version is required. Never overwrite published assets.
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -ne $Tag) { throw 'Tag does not match package version.' }
            gh release create $Tag $Zip[0].FullName --verify-tag --draft --title $Title --generate-notes
          } else {
            if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Manual releases must be built from main.' }
            git ls-remote --exit-code --tags origin "refs/tags/$Tag"
            if ($LASTEXITCODE -eq 0) { throw 'Tag already exists. Choose a new version; do not overwrite it.' }
            if ($LASTEXITCODE -ne 2) { throw 'Unable to verify whether the release tag already exists.' }
            gh release create $Tag $Zip[0].FullName --target $env:GITHUB_SHA --draft --title $Title --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release. Do not reuse an existing tag.' }
          gh release edit $Tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload succeeded, but publication failed. Inspect it before publishing.' }
