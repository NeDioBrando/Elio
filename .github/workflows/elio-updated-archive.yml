name: Build updated Elio archive (Windows x64)
on:
  push:
    branches: [feat/manual-vault-liquid-glass]
    paths: [.github/workflows/elio-updated-archive.yml]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Verify tag and package versions
        shell: pwsh
        run: |
          $Version = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$Version") { throw 'Tag does not match the package version.' }
      - name: Audit, test, compile and package
        shell: pwsh
        run: ./Build-Windows.ps1
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Elio-Windows-x64
          path: dist/elio-v*-Windows-x64.zip
          if-no-files-found: error
