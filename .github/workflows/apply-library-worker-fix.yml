name: Apply verified asset library worker fix
on:
  push:
    branches: ["update/latest-source-fbf54ce7"]
    paths: [".github/workflows/apply-library-worker-fix.yml"]
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/latest-source-fbf54ce7
      - name: Verify and apply source files
        shell: python
        run: |
          import base64,hashlib,json,lzma,pathlib,shutil
          root=pathlib.Path('.')
          parts=sorted((root/'.elio-library-fix-transfer').glob('part-*.b64'))
          assert len(parts)==2
          raw=base64.b64decode(''.join(p.read_text(encoding='ascii') for p in parts),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='9a6598c8f908d4b26eb81074b8d76dd37a65b2376d165082e9e1b0b22fb00a3f'
          bundle=json.loads(lzma.decompress(raw))
          for name,h in bundle['manifest'].items():
              assert not pathlib.PurePosixPath(name).is_absolute() and '..' not in pathlib.PurePosixPath(name).parts
              path=root/name
              expected=bundle['expected'][name]
              assert (hashlib.sha256(path.read_bytes()).hexdigest() if path.exists() else None)==expected, 'Concurrent source change: '+name
              content=bundle['objects'][h].encode('utf8')
              assert hashlib.sha256(content).hexdigest()==h
          for name,h in bundle['manifest'].items():
              path=root/name
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(bundle['objects'][h].encode('utf8'))
          shutil.rmtree(root/'.elio-library-fix-transfer')
          (root/'.github/workflows/apply-library-worker-fix.yml').unlink()
      - name: Commit fixed sources and remove temporary uploader
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix MV3 asset library startup imports; add real Chrome regression'
          git push origin HEAD:update/latest-source-fbf54ce7
      - name: Build corrected Windows archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-windows.yml --ref update/latest-source-fbf54ce7
