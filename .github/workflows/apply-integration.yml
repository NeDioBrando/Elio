name: Apply integration step 2 (temporary)
on:
  push:
    branches: [integration/main-merge]
    paths: ['.elio-integration/patch.b64']
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify and apply vault pinning patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .elio-integration/patch.b64 | xz -d > /tmp/integration.patch
          echo '903ac14079863746268fb1bb01a6716373b7232710f58fb21761ff387443584b  /tmp/integration.patch' | sha256sum -c -
          git apply --check /tmp/integration.patch
          git apply --index /tmp/integration.patch
          python tools/generate_locale_catalog.py
          python tools/stamp_build.py
          git rm -rq .elio-integration
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A core elio-Extension
          git status --short
          git commit -m 'Port per-chat AI vault pinning from feat/manual-vault-liquid-glass without its old theme' -m 'Native routing (checkpoints.rs, vault.rs, main.rs), vault UI controls with local styles, en/ru strings, live and UI tests. New UI files (theme.css, theme.js, elio.css, desktop.html, popup) are unchanged.'
          git push origin HEAD:integration/main-merge
      - name: Start Windows build on applied sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-windows.yml --ref integration/main-merge -f publish=false
