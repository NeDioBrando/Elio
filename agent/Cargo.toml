[package]
name = "elio-agent"
version = "1.0.1"
edition = "2021"
description = "elio native agent — Roblox Studio MCP + AgentScript workspace bridge"
license = "GPL-3.0-or-later"
authors = ["PlazCode contributors", "synerixcode fork contributors"]

[[bin]]
name = "elio"
path = "src/main.rs"

[dependencies]
getrandom = "0.2"
sha2 = "0.10"
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
sysinfo = { version = "0.32", features = [] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-tungstenite = "0.26"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
once_cell = "1.20"

rbx_binary = "3.0"
rbx_xml = "3.0"
rbx_dom_weak = "4.2"
rbx_reflection_database = "3.0"

glob = "0.3"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png"] }


[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tao = { version = "0.37.0", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57.0", default-features = false, features = ["os-webview"] }
http = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
